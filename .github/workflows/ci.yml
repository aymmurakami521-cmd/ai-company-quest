# Minimal CI for the quest core (tests + typecheck).
# This workflow is owner-approved and intentionally separate from claude.yml.
#
# Note on dependencies: this package has zero runtime and zero dev dependencies,
# so package-lock.json is empty by design. TypeScript is fetched only for the
# typecheck step with --no-save, which keeps the lockfile authoritative.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify the lockfile is installable
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: |
          npm install --no-save --no-package-lock typescript@^5.6.0 @types/node@^22.7.0
          npm run typecheck
